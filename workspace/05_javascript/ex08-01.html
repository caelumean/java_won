<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
  // 사용자가 입력한 연산자와 숫자를 받아 연산을 수행하는 프로그램
  // 잘못된 연산자를 입력할 경우 "잘못된 연산자입니다." 출력

  // let operator = '+';  // 연산자 변수
  // let operator = '-';  // 연산자 변수
  // let operator = '*';  // 연산자 변수
  // let operator = '/';  // 연산자 변수
  // let operator = '.';  // 연산자 변수
  let n1 = 10;         // 첫 번째 숫자
  let n2 = 20;         // 두 번째 숫자
  let result = null;   // 연산 결과

  let num1 = Number(prompt("첫 번째 숫자를 입력"));
  let operator = prompt("연산자를 입력")
  let num2 = Number(prompt("두 번째 숫자를 입력"));
  
  // 출력 예시: 10 + 20 = 30

  // if-else if 문을 사용한 사칙연산 구현
   if(operator === '+'){
      result =  num1 + num2;
   }else if(operator == '-'){
      result =  num1 - num2;
   }else if(operator == '*'){
      result =  num1 * num2;
   }else if(operator == '/'){
      result =  num1 / num2;
   }else{
    console.log("잘못된 연산입니다.");
   }

  // switch문으로 작성
  switch(operator){
    case "+":
      result =  num1 + num2;
      break;
    case "-":
      result =  num1 - num2;
      break;
    case "*":
      result =  num1 * num2;
      break;
    case "/":
      if(nu2 == 0){
        console.log("0으로 나눌 수 없습니다.");
      }
      result =  num1 / num2;
      break;
      default: 
      console.log("잘못된 연산입니다.");
  }
    
  // if(result != null) {
  //   console.log(`${n1} ${operator} ${n2} = ${result}`);
  // }
   if(result != null) {
    console.log(`${num1} ${operator} ${num2} = ${result}`);
  }

  </script>
</head>
<body>
  <h1>08-01 if, switch</h1>
</body>
</html>
